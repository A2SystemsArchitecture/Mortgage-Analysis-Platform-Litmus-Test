<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeTrue — Coming Soon</title>
<meta name="description" content="Honest mortgage analysis. No pressure. No agenda. Coming soon.">
<meta name="theme-color" content="#1a2332">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a2332;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;}
.wrap{text-align:center;padding:2rem;}
.logo{font-family:'Fraunces',serif;font-size:2.5rem;font-weight:900;color:#ffffff;letter-spacing:-.03em;margin-bottom:.75rem;}
.logo span{color:#388e5e;}
.rule{width:2rem;height:2px;background:linear-gradient(90deg,#0097a7,#388e5e);margin:.75rem auto;}
.tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(140,220,230,.8);margin-bottom:2rem;}
.status{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(176,190,197,.5);}
.email-wrap{margin-top:2rem;}
.email-wrap input{background:rgba(255,255,255,.07);border:1px solid rgba(0,151,167,.3);border-radius:6px;padding:.65rem 1rem;font-family:'DM Mono',monospace;font-size:.8rem;color:#ffffff;width:260px;outline:none;}
.email-wrap input::placeholder{color:rgba(176,190,197,.35);}
.email-wrap input:focus{border-color:#0097a7;}
.email-wrap button{background:#0097a7;color:#ffffff;border:none;padding:.65rem 1.25rem;border-radius:6px;font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;margin-left:.5rem;transition:background .2s;}
.email-wrap button:hover{background:#006670;}
.legal{font-size:.55rem;color:rgba(176,190,197,.3);margin-top:.75rem;letter-spacing:.05em;}
.confirm{font-size:.65rem;color:#388e5e;margin-top:.5rem;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Home<span>True</span></div>
  <div class="rule"></div>
  <div class="tag">Honest mortgage analysis. No pressure. No agenda.</div>
  <div class="status">Coming Soon</div>
  <div class="email-wrap">
    <input type="email" id="email" placeholder="your@email.com">
    <button onclick="notify()">Notify Me</button>
    <div class="legal">No spam. Launch notification only.</div>
    <div class="confirm" id="confirm">✓ You're on the list.</div>
  </div>
</div>
<script>
function notify(){
  var e=document.getElementById('email');
  if(e.value&&e.value.includes('@')){
    document.getElementById('confirm').style.display='block';
    e.value='';
  }
}
</script>
</body>
</html>
