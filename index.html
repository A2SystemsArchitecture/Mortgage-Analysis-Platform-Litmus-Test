<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeTrue | Launching November 1</title>
<meta name="description" content="The Truth Before the Offer. Honest mortgage analysis. No pressure. No agenda. Launching November 1.">
<meta name="theme-color" content="#1a2332">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a2332;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;}
.wrap{text-align:center;padding:2rem;max-width:100%;}
html,body{overflow-x:hidden;}
.logo{display:inline-block;background:#fff;border-radius:14px;padding:.4rem 1.1rem;margin-bottom:1rem;}
.logo img{display:block;width:min(440px,78vw);height:auto;}
.headline{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:#E9E4F7;letter-spacing:.01em;margin-bottom:.6rem;}
.rule{width:2rem;height:2px;background:linear-gradient(90deg,#4E2E8F,#1FA663);margin:.75rem auto;}
.tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(140,220,230,.8);margin-bottom:2rem;}
.status{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(176,190,197,.5);}
.email-wrap{margin-top:2rem;}
.email-wrap input{background:rgba(255,255,255,.07);border:1px solid rgba(78,46,143,.6);border-radius:6px;padding:.65rem 1rem;font-family:'DM Mono',monospace;font-size:.8rem;color:#ffffff;width:min(260px,70vw);outline:none;}
.email-wrap input::placeholder{color:rgba(176,190,197,.35);}
.email-wrap input:focus{border-color:#1FA663;}
.email-wrap button{background:#4E2E8F;color:#ffffff;border:none;padding:.65rem 1.25rem;border-radius:6px;font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;margin-left:.5rem;transition:background .2s;}
.email-wrap button:hover{background:#3b2270;}
.legal{font-size:.55rem;color:rgba(176,190,197,.3);margin-top:.75rem;letter-spacing:.05em;}
.confirm{font-size:.65rem;color:#1FA663;margin-top:.5rem;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="/brand/hometrue-horizontal-lockup.png" alt="HomeTrue: A clearer path to a brighter home." width="2172" height="724"></div>
  <div class="headline">The Truth Before the Offer.</div>
  <div class="rule"></div>
  <div class="tag">Honest mortgage analysis. No pressure. No agenda.</div>
  <div class="status">Launching November 1</div>
  <div class="email-wrap">
    <input type="email" id="email" placeholder="your@email.com">
    <button onclick="notify()">Notify Me</button>
    <div class="legal">No spam. Launch notification only.</div>
    <div class="confirm" id="confirm">✓ You're on the list.</div>
  </div>
</div>
<script>
function notify(){
  var e=document.getElementById('email');
  if(e.value&&e.value.includes('@')){
    document.getElementById('confirm').style.display='block';
    e.value='';
  }
}
</script>
</body>
</html>
