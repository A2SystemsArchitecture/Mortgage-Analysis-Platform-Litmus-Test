name: HomeTrue Site Refresh TEMP

on:
  push:
    paths:
      - '.hometrue-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update HomeTrue platform
        run: python3 .github/scripts/hometrue_refresh.py
      - name: Commit refreshed site
        run: |
          git config user.name "HomeTrue Release Update"
          git config user.email "actions@users.noreply.github.com"
          git add platform.html site.webmanifest
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Update HomeTrue for Nov 1 launch and current PMMS"
          git push
