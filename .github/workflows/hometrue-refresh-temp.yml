name: HomeTrue Site Refresh TEMP

on:
  push:
    paths:
      - '.hometrue-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize HomeTrue palette
        run: python3 .github/scripts/hometrue_finalize.py
      - name: Commit finalized site
        run: |
          git config user.name "HomeTrue Release Update"
          git config user.email "actions@users.noreply.github.com"
          git add platform.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Finalize HomeTrue Refined Baseline palette"
          git push
