name: Batch 1 thirty-market financial audit (no deployment)
on:
  push:
    branches:
      - tax-corrections-audit-nov-2026
    paths:
      - '.github/workflows/batch1-thirty-financial-audit.yml'
      - 'tests/**'
      - 'platform.html'
      - 'audits/HomeTrue-2027-launch-verification-gates.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing Batch 1 market arithmetic regressions (no Dorchester)
        shell: bash
        run: |
          set +e
          mkdir -p audit-results
          : > audit-results/results.tsv
          failed=0
          found=0
          for file in \
            tests/hometrue-batch1-market-config-parse.js \
            tests/hometrue-batch1-roscoe-homestead-evidence-guard.js \
            tests/hometrue-batch1-buyer-parcel-fees-input-disclosure.js \
            tests/hometrue-florida-2026-ad-valorem.js \
            tests/hometrue-florida-homestead-guide-selected-rate-truth.js \
            tests/hometrue-dawson-2026-senior-exemption-eligibility.js \
            tests/hometrue-fulton-2026-interim-bill-homestead-year-guard.js \
            tests/hometrue-batch1-millage-source-regression.js \
            tests/hometrue-batch1-tax-tests.js \
            tests/hometrue-state-closing-smoke.js \
            tests/hometrue-miami-dade-2026-districts.js \
            tests/hometrue-miami-dade-2026-official-composites.js \
            tests/hometrue-broward-2026-districts.js \
            tests/hometrue-broward-2026-independent-authority.js \
            tests/hometrue-broward-2026-full-district-official.js \
            tests/hometrue-palm-beach-2026-unincorporated.js \
            tests/hometrue-palm-beach-2026-final-components.js \
            tests/hometrue-palm-beach-2026-final-vs-proposed-guard.js \
            tests/hometrue-martin-2026-districts.js \
            tests/hometrue-martin-2026-independent-authority.js \
            tests/hometrue-st-lucie-2026-districts.js \
            tests/hometrue-st-lucie-2026-independent-authority.js \
            tests/hometrue-indian-river-brevard-2026-districts.js \
            tests/hometrue-brevard-2026-official-composites.js \
            tests/hometrue-indian-river-2026-independent-authority.js \
            tests/hometrue-dekalb-ga-2026-district04.js \
            tests/hometrue-dekalb-ga-2026-official-district-codes.js \
            tests/hometrue-batch1-state-tax-scenarios.js \
            tests/hometrue-cobb-2026-official-levy-composites.js \
            tests/hometrue-fulton-ga-2026-four-city-source-components.js \
            tests/hometrue-clayton-ga-2026-districts.js \
            tests/hometrue-clayton-ga-2026-official-composites.js \
            tests/hometrue-hall-ga-2026-districts.js \
            tests/hometrue-hall-ga-2026-official-composites.js \
            tests/hometrue-paulding-ga-2026-unincorporated.js \
            tests/hometrue-paulding-ga-2026-official-composite.js \
            tests/hometrue-paulding-dallas-2026-source-year-guard.js \
            tests/hometrue-charleston-2026-sales-tax-credit.js \
            tests/hometrue-york-2026-levies.js \
            tests/hometrue-york-2026-official-rock-hill-rh.js \
            tests/hometrue-berkeley-2026-sales-tax-credit.js \
            tests/hometrue-berkeley-2026-official-buyer-composites.js \
            tests/hometrue-batch1-berkeley-pdf-source-period.js \
            tests/hometrue-jefferson-al-2026-districts.js \
            tests/hometrue-jefferson-al-2026-official-standard-rates.js \
            tests/hometrue-madison-limestone-al-2026.js \
            tests/hometrue-alabama-2026-official-composites.js \
            tests/hometrue-shelby-al-2026-districts.js \
            tests/hometrue-cherokee-canton-2026.js \
            tests/hometrue-cherokee-ga-2026-official-composites.js \
            tests/hometrue-cherokee-woodstock-2026.js \
            tests/hometrue-sc-2026-homestead-guidance.js \
            tests/hometrue-pickens-ga-2026-adopted.js \
            tests/hometrue-greenville-sc-2026-districts.js \
            tests/hometrue-richmond-ga-2026-districts.js \
            tests/hometrue-richmond-ga-2026-official-four-districts.js \
            tests/hometrue-columbia-ga-2026-source-guard.js \
            tests/hometrue-batch1-reconciliation-guard.js \
            tests/hometrue-batch1-certification-gate-integrity.js \
            tests/hometrue-batch1-six-open-rate-guard.js \
            tests/hometrue-batch1-affordability-savings.js \
            tests/hometrue-batch1-tier2-insurance-quote-truth.js \
            tests/hometrue-batch1-no-auto-district.js \
            tests/hometrue-buyer-tax-location-reset.js \
            tests/hometrue-share-tax-district.js \
            tests/hometrue-richland-sc-2026-1er.js \
            tests/hometrue-batch1-exact-charges.js \
            tests/hometrue-state-closing-tax-cases.js \
            tests/hometrue-sc-bill-fees.js \
            tests/hometrue-batch1-thirty-buyer-math.js \
            tests/hometrue-batch1-rate-year-policy.js \
            tests/hometrue-batch1-tier3-input-truth.js \
            tests/hometrue-sc-deed-transfer-boundaries.js \
            tests/hometrue-gwinnett-lawrenceville-2026-bills.js \
            tests/hometrue-gwinnett-2026-issued-bill-fee-reconciliation.js \
            tests/hometrue-gwinnett-2026-issued-homestead-net-bill.js \
            tests/hometrue-gwinnett-2026-s1r-authority-discrepancy-guard.js \
            tests/hometrue-forsyth-homestead-source-and-deadline.js \
            tests/hometrue-gwinnett-2026-four-district-source-boundaries.js \
            tests/hometrue-charleston-official-bill-buyer-reconciliation.js \
            tests/hometrue-charleston-2026-official-source-classified.js
          do
            if [ ! -f "$file" ]; then
              printf 'MISSING\t%s\n' "$file" | tee -a audit-results/results.tsv
              failed=$((failed+1))
              continue
            fi
            found=$((found+1))
            echo "::group::$file"
            node "$file" > "audit-results/$(basename "$file").log" 2>&1
            rc=$?
            cat "audit-results/$(basename "$file").log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              printf 'PASS\t%s\n' "$file" | tee -a audit-results/results.tsv
            else
              printf 'FAIL-%s\t%s\n' "$rc" "$file" | tee -a audit-results/results.tsv
              failed=$((failed+1))
            fi
          done
          echo "Found $found test files; problems $failed"
          test "$failed" -eq 0
      - name: Create uncertified district evidence inventory
        if: always()
        run: node tests/hometrue-batch1-district-inventory.js
      - name: Save financial test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-thirty-regression-evidence
          path: audit-results/
          if-no-files-found: warn
      - name: Evaluate thirty-market certification gate (expected blocked until evidence complete)
        if: always()
        shell: bash
        run: |
          set +e
          node tests/hometrue-batch1-excluding-dorchester-gate.js > audit-financial-gate.json 2>&1
          rc=$?
          cat audit-financial-gate.json
          echo "gate_exit_code=$rc" >> "$GITHUB_STEP_SUMMARY"
          echo "The gate status is reported as evidence, not waived."
          exit 0
      - name: Install isolated PDF test dependency
        if: always()
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jspdf@2.5.1
      - name: Render real three-page PDFs for thirty fictional markets
        if: always()
        run: node tests/hometrue-batch1-thirty-pdf-render.js
      - name: Preserve PDF smoke fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-thirty-pdf-smoke-fixtures
          path: audit-results/pdf-thirty/
          if-no-files-found: warn
      - name: Install isolated browser test dependency
        if: always()
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        if: always()
        run: npx playwright install chromium --with-deps
      - name: Browser test actual district selectors and shared buyer reports
        if: always()
        run: node tests/hometrue-batch1-browser-thirty.js
      - name: Preserve browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-thirty-browser-smoke
          path: audit-results/browser-thirty/
          if-no-files-found: warn
      - name: Save certification gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch1-thirty-gate-evidence
          path: audit-financial-gate.json
          if-no-files-found: warn

  financial-release-gate:
    name: Financial certification must actually pass (no deployment)
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce all thirty markets financially certified
        run: node tests/hometrue-batch1-excluding-dorchester-gate.js
